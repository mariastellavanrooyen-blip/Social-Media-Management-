# Create this exact app name on Fly (dashboard or `fly apps create solo-crm-ee2172`)
# before the first deploy. Pick your own name instead if you'd rather — just keep
# this file, the volume, and UNSUBSCRIBE_BASE_URL below all in sync with whatever you use.
app = "solo-crm-ee2172"
primary_region = "jnb" # Johannesburg, South Africa — closest Fly region to South Africa

[build]

[env]
  # SQLite + uploads live on the mounted volume so they survive deploys/restarts.
  DATABASE_URL = "sqlite:////data/crm.db"
  UPLOADS_DIR = "/data/uploads"
  UNSUBSCRIBE_BASE_URL = "https://solo-crm-ee2172.fly.dev"

[[mounts]]
  source = "crm_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
