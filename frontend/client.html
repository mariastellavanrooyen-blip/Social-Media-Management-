<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client — Solo CRM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><a href="/index.html">&larr; Clients</a></h1>
  </header>

  <div class="card">
    <form id="detail-form">
      <div class="field">
        <label for="f-name">Name *</label>
        <input type="text" id="f-name" required>
      </div>
      <div class="field">
        <label for="f-email">Email *</label>
        <input type="email" id="f-email" required>
      </div>
      <div class="field">
        <label for="f-company">Company</label>
        <input type="text" id="f-company">
      </div>
      <div class="field">
        <label for="f-phone">Phone</label>
        <input type="text" id="f-phone">
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status">
          <option value="lead">Lead</option>
          <option value="contacted">Contacted</option>
          <option value="active">Active</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="field">
        <label for="f-last-contact">Last contact date</label>
        <input type="date" id="f-last-contact">
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes"></textarea>
      </div>
      <div id="meta" class="meta"></div>
      <div id="error" class="error"></div>
      <div class="actions">
        <button type="submit">Save changes</button>
        <button type="button" class="danger" id="delete-btn">Delete client</button>
      </div>
    </form>
  </div>

  <script src="/static/detail.js"></script>
</body>
</html>
