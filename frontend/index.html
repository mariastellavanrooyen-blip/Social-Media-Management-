<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients — Solo CRM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Clients</h1>
    <button id="add-btn">+ Add client</button>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search name, email, company...">
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="lead">Lead</option>
      <option value="contacted">Contacted</option>
      <option value="active">Active</option>
      <option value="closed">Closed</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Company</th>
        <th>Status</th>
        <th>Last contact</th>
      </tr>
    </thead>
    <tbody id="client-rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No clients found.</div>

  <div id="add-modal" class="modal-backdrop hidden">
    <div class="card">
      <h2>Add client</h2>
      <form id="add-form">
        <div class="field">
          <label for="f-name">Name *</label>
          <input type="text" id="f-name" required>
        </div>
        <div class="field">
          <label for="f-email">Email *</label>
          <input type="email" id="f-email" required>
        </div>
        <div class="field">
          <label for="f-company">Company</label>
          <input type="text" id="f-company">
        </div>
        <div class="field">
          <label for="f-phone">Phone</label>
          <input type="text" id="f-phone">
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="lead">Lead</option>
            <option value="contacted">Contacted</option>
            <option value="active">Active</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes"></textarea>
        </div>
        <div id="add-error" class="error"></div>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" id="cancel-add">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/list.js"></script>
</body>
</html>
