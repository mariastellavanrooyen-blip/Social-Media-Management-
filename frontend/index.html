<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients — Marisol CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#221D18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marisol">
</head>
<body>
  <div class="masthead">
    <span class="logo-mark">MV</span>
    <span class="brand-name">Marisol CRM</span>
  </div>
  <div class="page">
    <nav class="nav">
      <a href="/index.html" class="active">Clients</a>
      <a href="/send.html">Bulk Email</a>
      <a href="/suppression.html">Suppression List</a>
    </nav>
    <header>
      <h1>Clients</h1>
      <button id="add-btn">+ Add client</button>
    </header>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, email, company...">
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="lead">Lead</option>
        <option value="contacted">Contacted</option>
        <option value="active">Active</option>
        <option value="closed">Closed</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Company</th>
          <th>Status</th>
          <th>Last contact</th>
        </tr>
      </thead>
      <tbody id="client-rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No clients found.</div>

    <div id="add-modal" class="modal-backdrop hidden">
      <div class="card">
        <h2>Add client</h2>
        <form id="add-form">
          <div class="field">
            <label for="f-name">Name *</label>
            <input type="text" id="f-name" required>
          </div>
          <div class="field">
            <label for="f-email">Email *</label>
            <input type="email" id="f-email" required>
          </div>
          <div class="field">
            <label for="f-company">Company</label>
            <input type="text" id="f-company">
          </div>
          <div class="field">
            <label for="f-phone">Phone</label>
            <input type="text" id="f-phone">
          </div>
          <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="lead">Lead</option>
              <option value="contacted">Contacted</option>
              <option value="active">Active</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="field">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes"></textarea>
          </div>
          <div id="add-error" class="error"></div>
          <div class="actions">
            <button type="submit">Save</button>
            <button type="button" class="secondary" id="cancel-add">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/pwa.js"></script>
  <script src="/static/list.js"></script>
</body>
</html>
